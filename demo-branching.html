<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Branching demo</title>
<style>
	:root {
		--bg: #0b0c10;
		--line: #6b7280;
		--node: #e5e7eb;
		--accent-a: #7dd3fc; /* Rose: calm, sparse, dark-mode */
		--accent-b: #38bdf8; /* Myron: voice-only */
		--accent-b2: #d946ef; /* Myron: voice-only, secondary wave color */
		--accent-c: #6b7280; /* generic: unresolved */
	}

	html, body {
		margin: 0;
		padding: 0;
		width: 100%;
		height: 100%;
		background: var(--bg);
		overflow: hidden;
		font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
	}

	svg {
		width: 100%;
		height: 100%;
		display: block;
	}

	/*
	 * Timeline (9s total):
	 *   0.0s  origin text + trunk draw
	 *   1.0s  Rose/Myron branches draw, frames fade in (Phase 1 layout: 2 personas, centered)
	 *   5.0s  expansion: Phase-1 branches/trunk fade out, Phase-2 branches/trunk fade in
	 *         (wider layout), generic frame slides in from the right
	 */

	.origin-text {
		fill: var(--node);
		font-size: 18px;
		text-anchor: middle;
		opacity: 0;
	}

	.origin-text.phase-1 {
		animation: fadein 0.5s ease-out forwards, fadeout 0.6s ease-in forwards;
		animation-delay: 0s, 4.6s;
	}

	.origin-text.phase-2 {
		animation: fadein 0.6s ease-out forwards;
		animation-delay: 5s;
	}

	.trunk {
		stroke: var(--line);
		stroke-width: 3;
		fill: none;
	}

	.phase-1-lines .trunk {
		stroke-dasharray: 300;
		stroke-dashoffset: 300;
		animation: draw 1s ease-out forwards, fadeout 0.6s ease-in forwards;
		animation-delay: 0.6s, 4.6s;
	}

	.phase-2-lines .trunk {
		opacity: 0;
		animation: fadein 0.5s ease-out forwards;
		animation-delay: 5s;
	}

	.branch {
		stroke-width: 3;
		fill: none;
	}

	.phase-1-lines .branch {
		stroke-dasharray: 400;
		stroke-dashoffset: 400;
		animation: draw 1.2s ease-out forwards, fadein 1.2s ease-out forwards,
			fadeout 0.6s ease-in forwards;
		animation-delay: 1.6s, 1.6s, 4.6s;
		opacity: 0;
	}

	.phase-2-lines .branch {
		opacity: 0;
		animation: fadein 0.6s ease-out forwards;
		animation-delay: 5.2s;
	}

	.branch-a { stroke: var(--accent-a); }
	.branch-b { stroke: var(--accent-b); }
	.branch-c { stroke: var(--accent-c); stroke-dasharray: 6 6; }

	@keyframes draw {
		to { stroke-dashoffset: 0; }
	}

	@keyframes fadein {
		to { opacity: 1; }
	}

	@keyframes fadeout {
		to { opacity: 0; }
	}

	.fragment {
		opacity: 0;
		animation: fadein 0.6s ease-out forwards;
		animation-delay: 2.7s;
	}

	.persona-label {
		fill: #d1d5db;
		font-size: 15px;
		font-weight: 600;
		text-anchor: middle;
		opacity: 0;
		animation: fadein 0.6s ease-out forwards;
		animation-delay: 2.7s;
	}

	.sub-label {
		fill: #9ca3af;
		font-size: 12px;
		text-anchor: middle;
		opacity: 0;
		animation: fadein 0.6s ease-out forwards;
		animation-delay: 2.9s;
	}

	/* persona frames slide from their Phase-1 position to Phase-2 position at t=5s */
	.rose-group {
		animation: shift-rose 9s ease-in-out forwards;
	}

	@keyframes shift-rose {
		0%, 55.5% { transform: translateX(0); }
		100% { transform: translateX(-160px); }
	}

	.myron-group {
		animation: shift-myron 9s ease-in-out forwards;
	}

	@keyframes shift-myron {
		0%, 55.5% { transform: translateX(0); }
		100% { transform: translateX(-160px); }
	}

	/* generic frame: absent, then slides in from further right at t=5s */
	.generic-group {
		opacity: 0;
		animation: enter-generic 9s ease-out forwards;
	}

	@keyframes enter-generic {
		0%, 55.5% { transform: translateX(120px); opacity: 0; }
		75% { transform: translateX(0); opacity: 1; }
		100% { transform: translateX(0); opacity: 1; }
	}

	/* Rose: translator UI, two stacked text panels */
	.device-frame {
		fill: #14181f;
		stroke: #262b33;
		stroke-width: 1.5;
	}

	.panel-src {
		fill: #1f2937;
	}

	.panel-tgt {
		fill: #1c2b38;
	}

	.text-line {
		fill: #7dd3fc;
		opacity: 0.85;
	}

	.text-line.dim {
		opacity: 0.45;
	}

	.lang-chip {
		fill: none;
		stroke: #4b5563;
		stroke-width: 1;
	}

	.lang-chip-text {
		fill: #9ca3af;
		font-size: 10px;
	}

	/* Myron: voice-only interface, styled after a listening/voice-assistant UI */
	.myron-frame {
		fill: #0f1420;
		stroke: #1e2740;
		stroke-width: 1.5;
	}

	.mic-glow {
		fill: url(#mic-glow-gradient);
	}

	.mic-core {
		fill: #10192e;
		stroke: #2c3a5c;
		stroke-width: 1;
	}

	.mic-ring {
		fill: none;
		stroke: var(--accent-b);
		stroke-width: 1.5;
		opacity: 0;
	}

	.mic-ring-1 {
		animation: pulse-ring 2.4s ease-out infinite;
		animation-delay: 3.2s;
	}

	.mic-ring-2 {
		animation: pulse-ring 2.4s ease-out infinite;
		animation-delay: 3.6s;
	}

	.mic-ring-3 {
		animation: pulse-ring 2.4s ease-out infinite;
		animation-delay: 4s;
	}

	@keyframes pulse-ring {
		0% { r: 12; opacity: 0.6; }
		100% { r: 34; opacity: 0; }
	}

	.wave-line {
		fill: none;
		stroke-width: 1.5;
		stroke-linecap: round;
		opacity: 0.85;
	}

	.wave-line-a {
		stroke: var(--accent-b);
		animation: flow-wave-a 2.6s ease-in-out infinite;
	}

	.wave-line-b {
		stroke: var(--accent-b2);
		animation: flow-wave-b 3.1s ease-in-out infinite;
	}

	@keyframes flow-wave-a {
		0%, 100% { d: path('M 0 12 Q 25 -4, 50 12 T 100 12 T 150 12 T 200 12'); }
		50% { d: path('M 0 12 Q 25 26, 50 12 T 100 12 T 150 12 T 200 12'); }
	}

	@keyframes flow-wave-b {
		0%, 100% { d: path('M 0 12 Q 30 24, 60 12 T 120 12 T 200 12'); }
		50% { d: path('M 0 12 Q 30 2, 60 12 T 120 12 T 200 12'); }
	}

	.listening-caption {
		fill: #9ca3af;
		font-size: 11px;
		text-anchor: middle;
		opacity: 0;
		animation: fadein 0.6s ease-out forwards;
		animation-delay: 3s;
	}

	.generic-frame-mark {
		fill: none;
		stroke: var(--accent-c);
		stroke-width: 2;
		stroke-dasharray: 6 6;
		opacity: 0.5;
	}
</style>
</head>
<body>
	<svg viewBox="0 0 1200 560" preserveAspectRatio="xMidYMid meet">
		<defs>
			<radialGradient id="mic-glow-gradient" cx="50%" cy="50%" r="50%">
				<stop offset="0%" stop-color="var(--accent-b)" stop-opacity="0.35" />
				<stop offset="100%" stop-color="var(--accent-b)" stop-opacity="0" />
			</radialGradient>
			<clipPath id="myron-frame-clip">
				<rect x="0" y="0" width="260" height="170" rx="14" />
			</clipPath>
		</defs>

		<!-- Phase 1: shared task centered above Rose (340) & Myron (760) -->
		<text class="origin-text phase-1" x="550" y="48">&ldquo;I'd like to translate this text&rdquo;</text>
		<g class="phase-1-lines">
			<path class="trunk" d="M 550 64 L 550 160" />
			<path class="branch branch-a" d="M 550 160 L 550 220 L 340 220 L 340 300" />
			<path class="branch branch-b" d="M 550 160 L 550 220 L 760 220 L 760 300" />
		</g>

		<!-- Phase 2 (from t=5s): shared task recenters above Rose (180), Myron (600), generic (1020) -->
		<text class="origin-text phase-2" x="600" y="48">&ldquo;I'd like to translate this text&rdquo;</text>
		<g class="phase-2-lines">
			<path class="trunk" d="M 600 64 L 600 160" />
			<path class="branch branch-a" d="M 600 160 L 600 220 L 180 220 L 180 300" />
			<path class="branch branch-b" d="M 600 160 L 600 220 L 600 300" />
			<path class="branch branch-c" d="M 600 160 L 600 220 L 1020 220 L 1020 300" />
		</g>

		<!-- Rose: calm, sparse, dark-mode translator UI (slides from x=340 to x=180 at t=5s) -->
		<g class="rose-group">
			<g class="fragment" transform="translate(210, 310)">
				<rect class="device-frame" x="0" y="0" width="260" height="170" rx="14" />

				<!-- source panel -->
				<rect class="panel-src" x="16" y="16" width="228" height="62" rx="8" />
				<rect class="lang-chip" x="24" y="24" width="46" height="16" rx="8" />
				<text class="lang-chip-text" x="47" y="35" text-anchor="middle">EN</text>
				<rect class="text-line" x="24" y="48" width="180" height="7" rx="3" />
				<rect class="text-line dim" x="24" y="60" width="130" height="7" rx="3" />

				<!-- target panel -->
				<rect class="panel-tgt" x="16" y="86" width="228" height="62" rx="8" />
				<rect class="lang-chip" x="24" y="94" width="46" height="16" rx="8" />
				<text class="lang-chip-text" x="47" y="105" text-anchor="middle">DE</text>
				<rect class="text-line" x="24" y="118" width="196" height="7" rx="3" />
				<rect class="text-line dim" x="24" y="130" width="150" height="7" rx="3" />
			</g>
			<text class="persona-label" x="340" y="512">Rose</text>
			<text class="sub-label" x="340" y="530">Sparse, Dark</text>
		</g>

		<!-- Myron: voice-only interface, styled after a listening/voice-assistant UI (slides from x=760 to x=600 at t=5s) -->
		<g class="myron-group">
			<g class="fragment" transform="translate(630, 310)">
				<rect class="myron-frame" x="0" y="0" width="260" height="170" rx="14" />

				<g clip-path="url(#myron-frame-clip)">
					<!-- mic, centered in top 50% of the frame -->
					<g transform="translate(130, 46)">
						<circle class="mic-ring mic-ring-1" cx="0" cy="0" r="12" />
						<circle class="mic-ring mic-ring-2" cx="0" cy="0" r="12" />
						<circle class="mic-ring mic-ring-3" cx="0" cy="0" r="12" />
						<circle class="mic-glow" cx="0" cy="0" r="30" />
						<circle class="mic-core" cx="0" cy="0" r="14" />
					</g>

					<!-- flowing wave lines, contained within the bottom 50% of the frame -->
					<g transform="translate(30, 118)">
						<path class="wave-line wave-line-a" d="M 0 12 Q 25 -4, 50 12 T 100 12 T 150 12 T 200 12" />
						<path class="wave-line wave-line-b" d="M 0 12 Q 30 24, 60 12 T 120 12 T 200 12" />
					</g>
				</g>

				<text class="listening-caption" x="130" y="152">Listening&hellip;</text>
			</g>
			<text class="persona-label" x="760" y="512">Myron</text>
			<text class="sub-label" x="760" y="530">Voice Only</text>
		</g>

		<!-- generic: unresolved / unnamed, slides in from the right at t=5s, settling at x=1020 -->
		<g class="generic-group">
			<g transform="translate(890, 310)">
				<rect class="device-frame" x="0" y="0" width="260" height="170" rx="14" />
				<line class="generic-frame-mark" x1="40" y1="40" x2="220" y2="130" />
				<line class="generic-frame-mark" x1="220" y1="40" x2="40" y2="130" />
			</g>
		</g>
	</svg>
</body>
</html>
